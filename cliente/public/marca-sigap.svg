<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="SIGAP">
  <title>SIGAP</title>
  <!-- Anel pontilhado: 26 pontos igualmente espaçados na circunferência. -->
  <circle cx="20" cy="20" r="17.0" fill="none" stroke="#1e4034" stroke-width="2.6"
          stroke-linecap="round" stroke-dasharray="0.01 4.1082"
          transform="rotate(-90 20 20)" />
  <!-- Barras crescentes: a produtividade que o anel acompanha. -->
  <path d="M13.5 25.5V21M20 25.5V14.5M26.5 25.5v-7" fill="none" stroke="#2f6b55"
        stroke-width="3" stroke-linecap="round" />
</svg>

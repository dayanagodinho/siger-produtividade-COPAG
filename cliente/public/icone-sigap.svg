<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SIGAP">
  <title>SIGAP</title>
  <!--
    Versao reduzida da marca, para a aba do navegador.

    A marca cheia tem folhas, cinco barras e dezessete pontos: a 16 pixels
    tudo isso vira uma mancha. Aqui sobram o circulo aberto, quatro pontos e
    tres barras largas — o que ainda se reconhece no tamanho de um favicon.
  -->
  <path d="M 20.4 3.9 A 13 13 0 1 0 9.4 28.3" fill="none" stroke="#1e4034"
        stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="25.3" cy="6.6" r="2.3" fill="#2f6b55"/>
  <circle cx="28.7" cy="11.9" r="1.9" fill="#2f6b55"/>
  <circle cx="29.0" cy="18.4" r="1.5" fill="#4d8571"/>
  <circle cx="26.2" cy="23.9" r="1.1" fill="#79a091"/>
  <rect x="9.4" y="9.6" width="4.6" height="13.4" rx="0.4" fill="#1e4034"/>
  <rect x="15.4" y="13.4" width="4.6" height="9.6" rx="0.4" fill="#2f6b55"/>
  <rect x="21.4" y="17.4" width="4.6" height="5.6" rx="0.4" fill="#79a091"/>
</svg>
